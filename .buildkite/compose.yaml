services:
  golangci-lint:
    image: golangci/golangci-lint:v2.11.3
    working_dir: /plugin
    volumes:
      - ..:/plugin
      - ~/.cache/golangci-lint/v1.54.1:/root/.cache
  golang:
    image: golang:1.26.10-bookworm
    working_dir: /plugin
    environment:
      GOTOOLCHAIN: local
    volumes:
      - ..:/plugin
